<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Hesteløber 🐴</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, #5a6f9e 0%, #8a6f96 55%, #a8776a 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    color: #fff;
  }
  h1 { margin-bottom: 10px; font-size: 1.6rem; color: #2f2438; }
  #info { margin-bottom: 10px; opacity: 0.95; font-size: 0.95rem; color: #4c3a52; }
  canvas {
    background: #87CEEB;
    border: 3px solid #333;
    border-radius: 8px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  #scoreboard { margin-top: 10px; font-size: 1.1rem; color: #2f2438; }
</style>
</head>
<body>
<h1>🐴 Hesteløber</h1>
<div id="info">Tryk <b>mellemrum</b>/<b>klik</b> for at hoppe — tryk <b>to gange</b> i luften for et <b>dobbeltspring</b> med flip!<br>Du får <b>kun point</b> ved at springe over forhindringerne — tætte spring giver <b>bonus</b> og <b>combo</b>.</div>
<canvas id="game" width="900" height="400"></canvas>
<div id="scoreboard">Point: 0 &nbsp;|&nbsp; Bedste: 0</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const GROUND = H - 50;

let state = 'menu'; // menu, playing, gameover
let score = 0, best = Number(localStorage.getItem('hesteloeber_point_best') || 0);
let speed = 5, frame = 0;

const horse = { x: 120, y: GROUND, vy: 0, size: 45, onGround: true, legPhase: 0, jumps: 0, spin: 0 };
let obstacles = [];
let clouds = [];
let stars = [];
let particles = [];
let floaters = [];
let combo = 0, comboTimer = 0;

for (let i = 0; i < 4; i++) clouds.push({ x: Math.random()*W, y: 40+Math.random()*100, s: 0.6+Math.random()*0.8 });
// Stjerner på den mørke del af aftenhimlen
for (let i = 0; i < 45; i++) {
  stars.push({ x: Math.random()*W, y: Math.random()*130, r: 0.5 + Math.random()*1.3, a: 0.35 + Math.random()*0.65 });
}

function puff(x, y, n, up) {
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    particles.push({
      x, y,
      vx: Math.cos(a) * 3.2,
      vy: Math.sin(a) * 2.4 - (up || 0),
      r: 3 + Math.random() * 2,
      life: 1
    });
  }
}

function jump() {
  if (state === 'menu') { startGame(); return; }
  if (state === 'gameover' && frame - gameOverFrame > 40) { startGame(); return; }
  if (state !== 'playing') return;

  if (horse.onGround) {
    // første spring
    horse.vy = -13;
    horse.onGround = false;
    horse.jumps = 1;
  } else if (horse.jumps < 2) {
    // dobbeltspring: ekstra skub opad + flip
    horse.vy = -11.5;
    horse.jumps = 2;
    horse.spin = 1;
    puff(horse.x, horse.y - 20, 12, 1.5);
  }
}

function startGame() {
  state = 'playing';
  score = 0; speed = 5; frame = 0;
  horse.y = GROUND; horse.vy = 0; horse.onGround = true;
  horse.jumps = 0; horse.spin = 0;
  obstacles = [];
  particles = [];
  floaters = [];
  combo = 0; comboTimer = 0;
}

function spawnObstacle() {
  const types = ['pumpkin', 'pumpkin', 'bush', 'rock', 'fence'];
  const type = types[Math.floor(Math.random()*types.length)];
  const sizes = { pumpkin: [46, 40], bush: [40, 35], rock: [35, 30], fence: [25, 60] };
  let [w, h] = sizes[type];
  if (type === 'pumpkin') {
    // græskar i lidt forskellige størrelser
    const k = 0.85 + Math.random() * 0.45;
    w = Math.round(w * k); h = Math.round(h * k);
  }
  obstacles.push({ x: W + 50, w, h, type, minClear: Infinity, passed: false });
}

function update() {
  if (state !== 'playing') return;
  frame++;
  // Point kommer KUN fra spring over forhindringerne (se nedenfor).
  // Sværhedsgraden stiger i stedet med afstanden man har løbet.
  speed = 5 + Math.min(frame / 1000, 7);

  // Hest fysik
  horse.vy += 0.6;
  horse.y += horse.vy;
  if (horse.y >= GROUND) {
    if (!horse.onGround && horse.vy > 6) puff(horse.x, GROUND, 6, 0.4);
    horse.y = GROUND; horse.vy = 0; horse.onGround = true; horse.jumps = 0;
  }
  if (!horse.onGround) horse.legPhase += 0.28; else horse.legPhase += speed * 0.15;

  // Flip-animation ved dobbeltspring
  if (horse.spin > 0) horse.spin = Math.max(0, horse.spin - 0.04);

  // Partikler (støv)
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.vx *= 0.97; p.life -= 0.035; });
  particles = particles.filter(p => p.life > 0);

  // Bonus-point-tekster flyver op og forsvinder
  floaters.forEach(f => { f.y -= 1.1; f.life -= 0.018; });
  floaters = floaters.filter(f => f.life > 0);

  // Combo nulstilles hvis der går for lang tid mellem tætte spring
  if (comboTimer > 0) {
    comboTimer--;
    if (comboTimer === 0) combo = 0;
  }

  // Forhindringer
  if (frame % Math.max(50, 90 - Math.floor(speed*5)) === 0) spawnObstacle();
  const hx0 = horse.x - 18, hw0 = 40;
  obstacles.forEach(o => {
    o.x -= speed;
    // hvor tæt var hesten på forhindringens top, mens den var over den?
    if (o.x < hx0 + hw0 && o.x + o.w > hx0) {
      const clearance = (GROUND - o.h) - horse.y;
      if (clearance < o.minClear) o.minClear = clearance;
    }
    // forhindringen er passeret uden sammenstød
    if (!o.passed && o.x + o.w < hx0) {
      o.passed = true;
      if (o.minClear < 40) {
        // tæt spring = bonuspoint (og combo hvis man gør det igen)
        combo++;
        comboTimer = 160;
        const bonus = 50 * combo;
        score += bonus;
        floaters.push({ x: horse.x + 30, y: GROUND - o.h - 24, life: 1, text: `+${bonus}` });
        if (combo > 1) floaters.push({ x: horse.x + 30, y: GROUND - o.h - 54, life: 1, text: `COMBO x${combo}`, combo: true });
        puff(horse.x, GROUND - 6, 6, 0.6);
      } else if (o.minClear >= 0 && o.minClear < Infinity) {
        // rent spring over forhindringen
        score += 10;
        floaters.push({ x: horse.x + 30, y: GROUND - o.h - 24, life: 1, text: '+10', small: true });
      }
    }
  });
  obstacles = obstacles.filter(o => o.x > -100);

  // Skyer
  clouds.forEach(c => { c.x -= c.s; if (c.x < -100) { c.x = W+50; c.y = 30+Math.random()*120; } });

  // Kollision (bounding box)
  const hx = horse.x - 18, hy = horse.y - horse.size, hw = 40;
  for (const o of obstacles) {
    const oy = GROUND - o.h;
    if (hx + 6 < o.x + o.w - 4 && hx + hw - 6 > o.x + 4 &&
        hy + 6 < GROUND && horse.y > oy + 6) {
      state = 'gameover';
      gameOverFrame = frame;
      best = Math.max(best, Math.floor(score));
      localStorage.setItem('hesteloeber_point_best', best);
    }
  }
  document.getElementById('scoreboard').textContent =
    `Point: ${Math.floor(score)}  |  Bedste: ${best}`;
}

let gameOverFrame = 0;

const TAU = Math.PI * 2;
// Kostume på hesten: 'pumpkin' = græskar-udklædning, 'none' = almindelig brun hest
const COSTUME = 'pumpkin';
// Rytter på hestens ryg: 'pumpkin' = græskar-rytter, 'none' = ingen rytter
const RIDER = 'pumpkin';

// Et enkelt ben: hofte -> kn/has -> hov, med galop-cyklus
function drawLeg(hx, hy, ph, front, dead, ground, pal) {
  const p = ((ph % TAU) + TAU) % TAU / TAU;
  let fx, fy;
  if (dead) {
    fx = hx + 13; fy = hy + 24;
  } else if (ground > 3) {
    // i luften: benene strakt/tucked alt efter fase
    const t = Math.sin(p * TAU);
    fx = hx + (front ? 11 : -9) + t * 5;
    fy = hy + 13 + Math.cos(p * TAU) * 4;
  } else if (p < 0.45) {
    // standfase: hoven står på jorden og glider bagud
    const t = p / 0.45;
    fx = hx + 15 - t * 30;
    fy = ground;
  } else {
    // svingfase: benet svinger fremad med løft
    const t = (p - 0.45) / 0.55;
    fx = hx - 15 + t * 30;
    fy = hy + 15 - Math.sin(t * Math.PI) * 16;
  }
  const bend = dead ? 0 : Math.max(0, Math.sin(p * TAU + 1)) * 7;
  const kx = (hx + fx) / 2 + (front ? 5 : -5);
  const ky = (hy + fy) / 2 - 3 - bend;

  // lår (tyk)
  ctx.strokeStyle = pal.dark;
  ctx.lineWidth = 10;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(hx, hy);
  ctx.quadraticCurveTo(hx + (kx - hx) * 0.7, hy + (ky - hy) * 0.45, kx, ky);
  ctx.stroke();
  // underben (tyndere)
  ctx.strokeStyle = pal.body;
  ctx.lineWidth = 5.5;
  ctx.beginPath();
  ctx.moveTo(kx, ky);
  ctx.lineTo(fx, fy - 3);
  ctx.stroke();
  // hov
  ctx.fillStyle = '#2e2018';
  ctx.beginPath();
  ctx.ellipse(fx, fy - 1, 4.5, 3.5, 0, 0, TAU);
  ctx.fill();
}

// --- Græskar-rytter der sidder på hestens ryg ---
function drawRider(bob, phase, dead) {
  const seatX = 4, seatY = -53 + bob;
  const bnc = dead ? 0 : Math.sin(phase * 2 + 1) * 1.4;
  const armW = dead ? 0 : Math.sin(phase * 2) * 1.6;

  ctx.save();
  if (dead) {
    // rytteren vælter bagover
    ctx.translate(seatX, seatY);
    ctx.rotate(1.25);
    ctx.translate(-seatX, -seatY);
  }

  // --- Ben langs hestens flank (fjerneste først) ---
  for (const [dx, shade] of [[-3, '#3a2f52'], [5, '#4a3b63']]) {
    ctx.strokeStyle = shade;
    ctx.lineWidth = 6.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(seatX + dx, seatY + 3);
    ctx.quadraticCurveTo(seatX + dx + 9, seatY + 10 + bnc * 0.3, seatX + dx + 6, seatY + 21);
    ctx.stroke();
    ctx.fillStyle = '#241a14';           // støvle
    ctx.beginPath();
    ctx.ellipse(seatX + dx + 7, seatY + 23, 4.5, 3, 0.15, 0, TAU);
    ctx.fill();
  }

  // --- Overkrop (frakke) ---
  const cg = ctx.createLinearGradient(0, seatY - 16, 0, seatY + 2);
  cg.addColorStop(0, '#7a5cb8');
  cg.addColorStop(1, '#3a2a5e');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.roundRect(seatX - 7, seatY - 15, 15, 18, 5);
  ctx.fill();

  // --- Arm der rækker efter tøjlerne ---
  ctx.strokeStyle = '#4a3b63';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(seatX + 3, seatY - 11);
  ctx.quadraticCurveTo(seatX + 13, seatY - 11 - armW, seatX + 20, seatY - 7 - armW);
  ctx.stroke();
  ctx.fillStyle = '#c98a3a';             // handske/hånd
  ctx.beginPath();
  ctx.arc(seatX + 21, seatY - 7 - armW, 2.8, 0, TAU);
  ctx.fill();

  // --- Tøjle der løber hen til hestens grime ---
  ctx.strokeStyle = '#3b2a5e';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(seatX + 21, seatY - 7 - armW);
  ctx.quadraticCurveTo(34, -56 + bob - armW, 46, -64 + bob);
  ctx.stroke();

  // --- Græskar-hoved med carvede ansigt ---
  const hx = seatX + 2, hy = seatY - 24 + bnc;
  ctx.shadowColor = 'rgba(255,150,30,0.8)';
  ctx.shadowBlur = 7;
  const hg = ctx.createRadialGradient(hx - 3, hy - 4, 2, hx, hy, 12);
  hg.addColorStop(0, '#ffbe5e');
  hg.addColorStop(1, '#e07308');
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.ellipse(hx, hy, 10, 9.2, 0, 0, TAU);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(80,28,0,0.55)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  if (dead) {
    ctx.strokeStyle = '#4a1f00';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(hx - 5, hy - 4); ctx.lineTo(hx - 1, hy);
    ctx.moveTo(hx - 1, hy - 4); ctx.lineTo(hx - 5, hy);
    ctx.moveTo(hx + 1, hy - 4); ctx.lineTo(hx + 5, hy);
    ctx.moveTo(hx + 5, hy - 4); ctx.lineTo(hx + 1, hy);
    ctx.stroke();
  } else {
    // trekant-øjne
    ctx.fillStyle = '#5a2600';
    ctx.beginPath();
    ctx.moveTo(hx - 5.5, hy - 3.5); ctx.lineTo(hx - 1.5, hy - 3.5); ctx.lineTo(hx - 3.5, hy + 0.5);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(hx + 1.5, hy - 3.5); ctx.lineTo(hx + 5.5, hy - 3.5); ctx.lineTo(hx + 3.5, hy + 0.5);
    ctx.closePath(); ctx.fill();
  }
  // grin
  ctx.fillStyle = '#5a2600';
  ctx.beginPath();
  ctx.moveTo(hx - 5.5, hy + 3);
  ctx.lineTo(hx - 3.5, hy + 5.5);
  ctx.lineTo(hx - 1.5, hy + 3);
  ctx.lineTo(hx + 0.5, hy + 5.5);
  ctx.lineTo(hx + 2.5, hy + 3);
  ctx.lineTo(hx + 4.5, hy + 5);
  ctx.quadraticCurveTo(hx, hy + 8, hx - 5.5, hy + 3);
  ctx.closePath(); ctx.fill();

  // stilk på hovedet
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#6b7a26';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(hx, hy - 9);
  ctx.quadraticCurveTo(hx - 1, hy - 14, hx + 3, hy - 15);
  ctx.stroke();

  ctx.restore();
}

function drawHorse(x, y, phase, dead, spin) {
  ctx.save();
  ctx.translate(x, y);
  if (spin > 0 && !dead) {
    // roter omkring hestens midte under dobbeltspring-flippet
    ctx.translate(2, -34);
    ctx.rotate(-Math.PI * 2 * (1 - spin));
    ctx.translate(-2, 34);
  }
  const ground = Math.max(0, GROUND - y); // lokal jord-højde (0 = på jorden)
  const bob = dead ? 0 : Math.sin(phase * 2) * 1.5;

  // --- Kostume: græskar-udklædning ---
  const isPumpkin = COSTUME === 'pumpkin';
  const pal = isPumpkin
    ? { body: '#f28b1c', dark: '#c95b06', light: '#ffbe5e', hair: '#5d6b21' }
    : { body: '#9a6234', dark: '#7d4a22', light: '#b57c4a', hair: '#33200e' };
  const padColor = isPumpkin ? '#3f6b3c' : '#c0392b';

  // --- Bagerste (fjerneste) ben, tegnes bag kroppen ---
  ctx.save();
  ctx.filter = 'brightness(0.82)';
  drawLeg(-16, -26 + bob, phase + 2.4, false, dead, ground, pal);
  drawLeg(12, -28 + bob, phase + 1.4, true, dead, ground, pal);
  ctx.restore();

  // --- Hale (bag kroppen) — græskar vingranke ved kostume ---
  ctx.strokeStyle = pal.hair;
  ctx.lineCap = 'round';
  for (let i = 0; i < 7; i++) {
    const w = dead ? 0 : Math.sin(phase * 1.3 + i * 0.8) * 5;
    ctx.lineWidth = 6.5 - i * 0.65;
    ctx.beginPath();
    ctx.moveTo(-26, -40 + i * 2.2 + bob);
    ctx.bezierCurveTo(-38, -42 + w, -46, -28 + w, -43 + w, -10 + i * 2.2);
    ctx.stroke();
  }

  // --- Hals (tyk streg der forbinder krop og hoved) ---
  ctx.strokeStyle = pal.body;
  ctx.lineWidth = 21;
  ctx.beginPath();
  ctx.moveTo(13, -38 + bob);
  ctx.lineTo(33, -65 + bob);
  ctx.stroke();

  // --- Krop med skygge-gradient ---
  const g = ctx.createRadialGradient(-6, -40 + bob, 6, 0, -32 + bob, 34);
  g.addColorStop(0, pal.light);
  g.addColorStop(0.55, pal.body);
  g.addColorStop(1, pal.dark);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(0, -32 + bob, 30, 17.5, -0.06, 0, TAU);
  ctx.fill();
  if (isPumpkin) { // kant så hesten ikke smelter sammen med græskar-forhindringerne
    // buen afbrydes ved halsens rod, så kanten ikke skærer halsen over
    ctx.strokeStyle = 'rgba(80,28,0,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, -32 + bob, 30, 17.5, -0.06, -0.32, TAU - 1.32);
    ctx.stroke();
  }
  // bryst
  ctx.fillStyle = pal.dark;
  ctx.beginPath();
  ctx.ellipse(20, -28 + bob, 10, 13, 0.25, 0, TAU);
  ctx.fill();

  // --- Græskar-ribber på kroppen (kostume) ---
  if (isPumpkin) {
    ctx.strokeStyle = 'rgba(135,50,0,0.42)';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    for (const f of [-0.7, -0.35, 0, 0.35, 0.7]) {
      const xi = f * 30;
      const edge = Math.sqrt(1 - f * f);
      const topY = -32 + bob - 17.5 * edge + 1.5;
      const botY = -32 + bob + 17.5 * edge - 1.5;
      ctx.beginPath();
      ctx.moveTo(xi, topY);
      ctx.quadraticCurveTo(xi + f * 13, -32 + bob, xi, botY);
      ctx.stroke();
    }
  }

  // --- Saddle blanket + saddle ---
  ctx.fillStyle = padColor;
  ctx.beginPath();
  ctx.roundRect(-14, -52 + bob, 34, 20, 5);
  ctx.fill();
  ctx.fillStyle = '#e9b94b';
  ctx.beginPath();
  ctx.roundRect(-14, -52 + bob, 34, 5, 3);
  ctx.fill();
  ctx.fillStyle = '#5a3a1a';
  ctx.beginPath();
  ctx.roundRect(-8, -53 + bob, 22, 8, 4);
  ctx.fill();

  // --- Hoved ---
  ctx.fillStyle = pal.body;
  ctx.beginPath();
  ctx.ellipse(41, -69 + bob, 15, 9.5, -0.35, 0, TAU);
  ctx.fill();
  if (isPumpkin) {
    ctx.strokeStyle = 'rgba(80,28,0,0.5)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  // mule
  ctx.fillStyle = pal.dark;
  ctx.beginPath();
  ctx.ellipse(53, -64.5 + bob, 8, 6.5, -0.35, 0, TAU);
  ctx.fill();
  // næsebor
  ctx.fillStyle = isPumpkin ? '#4a2200' : '#3d2410';
  ctx.beginPath();
  ctx.ellipse(56, -63 + bob, 1.6, 1.2, 0, 0, TAU);
  ctx.fill();

  // glød omkring de carvede dele (jack-o'-lantern)
  if (isPumpkin) {
    ctx.shadowColor = 'rgba(255,150,30,0.85)';
    ctx.shadowBlur = 9;
  }

  if (isPumpkin) {
    // savtakket grin (carvet)
    ctx.fillStyle = '#5a2600';
    ctx.beginPath();
    ctx.moveTo(44, -60 + bob);
    ctx.lineTo(47, -55.5 + bob);
    ctx.lineTo(49, -60 + bob);
    ctx.lineTo(52, -55.5 + bob);
    ctx.lineTo(54, -60 + bob);
    ctx.lineTo(57, -56 + bob);
    ctx.lineTo(60, -59.5 + bob);
    ctx.quadraticCurveTo(52, -51.5 + bob, 44, -60 + bob);
    ctx.closePath();
    ctx.fill();
  } else {
    // blis (hvid stribe i ansigtet)
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.ellipse(46, -71 + bob, 2.6, 6, -0.35, 0, TAU);
    ctx.fill();
  }

  // øje med glans
  if (dead) {
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#241608';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(41, -73 + bob); ctx.lineTo(46, -68 + bob);
    ctx.moveTo(46, -73 + bob); ctx.lineTo(41, -68 + bob);
    ctx.stroke();
  } else if (isPumpkin) {
    // trekantet carvet øje med lysende pupille
    ctx.fillStyle = '#5a2600';
    ctx.beginPath();
    ctx.moveTo(35.5, -75 + bob);
    ctx.lineTo(45.5, -74 + bob);
    ctx.lineTo(40, -67 + bob);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ffc94d';
    ctx.beginPath();
    ctx.arc(41, -72 + bob, 2.4, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#5a2600';
    ctx.beginPath();
    ctx.arc(41.5, -72 + bob, 1.1, 0, TAU);
    ctx.fill();
    ctx.shadowBlur = 0;
  } else {
    ctx.fillStyle = '#1c1108';
    ctx.beginPath();
    ctx.arc(42.5, -72 + bob, 2.8, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(43.5, -73 + bob, 1, 0, TAU);
    ctx.fill();
  }

  // ører
  ctx.fillStyle = pal.dark;
  ctx.beginPath();
  ctx.moveTo(31, -76 + bob); ctx.quadraticCurveTo(32, -86 + bob, 37, -78 + bob);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(36, -76 + bob); ctx.quadraticCurveTo(38, -85 + bob, 42, -77 + bob);
  ctx.closePath(); ctx.fill();

  // græskarstilk som hat + slyng (kostume)
  if (isPumpkin) {
    ctx.strokeStyle = '#6b7a26';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(33, -77 + bob);
    ctx.quadraticCurveTo(32, -88 + bob, 39, -91 + bob);
    ctx.stroke();
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(39, -91 + bob);
    ctx.quadraticCurveTo(47, -94 + bob, 45, -87 + bob);
    ctx.stroke();
    ctx.fillStyle = '#5f9a2e';
    ctx.beginPath();
    ctx.ellipse(35, -87 + bob, 5.5, 2.8, -0.55, 0, TAU);
    ctx.fill();
  }

  // grime
  ctx.strokeStyle = isPumpkin ? '#6b4a1e' : '#3b2a5e';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(48, -66 + bob, 7.5, Math.PI * 1.15, Math.PI * 1.75);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(37, -74 + bob);
  ctx.lineTo(40, -60 + bob);
  ctx.stroke();

  // --- Mane (blæser bagud) — vingranke ved græskarkostume ---
  ctx.strokeStyle = pal.hair;
  for (let i = 0; i < 8; i++) {
    const t = i / 7;
    const sx = 33 - t * 20, sy = -73 + t * 32 + bob;
    const w = dead ? 0 : Math.sin(phase + i * 0.7) * 4;
    ctx.lineWidth = 5.5 - t * 2.2;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.quadraticCurveTo(sx - 7 + w, sy + 6, sx - 13 + w * 1.6, sy + 15);
    ctx.stroke();
  }

  // --- Forreste (nærmeste) ben ---
  drawLeg(-16, -26 + bob, phase, false, dead, ground, pal);
  drawLeg(12, -28 + bob, phase + Math.PI, true, dead, ground, pal);

  // --- Rytter på ryggen (tegnes sidst = forrest i billedet) ---
  if (RIDER !== 'none') drawRider(bob, phase, dead);

  ctx.restore();
}

function drawObstacle(o) {
  const y = GROUND - o.h;
  if (o.type === 'bush') {
    // mørk busk, oplyst svagt af aftenlyset
    const bg = ctx.createLinearGradient(0, y, 0, GROUND);
    bg.addColorStop(0, '#5d9455');
    bg.addColorStop(1, '#33532f');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.arc(o.x + o.w/2, GROUND - o.h/2, o.w/2, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#2b4728';
    ctx.beginPath();
    ctx.arc(o.x + 8, GROUND - 8, 12, 0, Math.PI*2);
    ctx.arc(o.x + o.w - 8, GROUND - 8, 12, 0, Math.PI*2);
    ctx.fill();
  } else if (o.type === 'rock') {
    const rg = ctx.createLinearGradient(0, y, 0, GROUND);
    rg.addColorStop(0, '#b3a49b');
    rg.addColorStop(1, '#6f5d55');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.moveTo(o.x, GROUND);
    ctx.lineTo(o.x + 5, y + 8);
    ctx.lineTo(o.x + o.w/2, y);
    ctx.lineTo(o.x + o.w - 4, y + 10);
    ctx.lineTo(o.x + o.w, GROUND);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,200,150,0.35)';
    ctx.beginPath();
    ctx.moveTo(o.x + 8, y + 10);
    ctx.lineTo(o.x + o.w/2, y + 2);
    ctx.lineTo(o.x + o.w/2 + 4, y + 12);
    ctx.closePath();
    ctx.fill();
  } else if (o.type === 'pumpkin') {
    // Græskar: sidelobes, ribben, stilk og varmt solstrejf
    const cx = o.x + o.w/2, cy = GROUND - o.h/2 + 2;
    const rw = o.w/2, rh = o.h/2;

    // skygge under græskaret
    ctx.fillStyle = 'rgba(30,12,20,0.35)';
    ctx.beginPath();
    ctx.ellipse(cx, GROUND + 2, rw * 1.05, 4, 0, 0, TAU);
    ctx.fill();

    // sidelobes
    const lobes = 5;
    for (let i = 0; i < lobes; i++) {
      const t = (i / (lobes - 1)) * 2 - 1;          // -1 .. 1
      const lx = cx + t * rw * 0.40;
      const lrx = rw * 0.52 * (1 - Math.abs(t) * 0.22);
      const lry = rh * (1 - Math.abs(t) * 0.12);
      const lg = ctx.createLinearGradient(lx - lrx, cy, lx + lrx, cy);
      lg.addColorStop(0, i % 2 ? '#c95b06' : '#e2710a');
      lg.addColorStop(0.45, '#f5911f');
      lg.addColorStop(1, '#b34e08');
      ctx.fillStyle = lg;
      ctx.beginPath();
      ctx.ellipse(lx, cy, lrx, lry, 0, 0, TAU);
      ctx.fill();
    }

    // mørk bundskygge
    ctx.fillStyle = 'rgba(90,32,0,0.28)';
    ctx.beginPath();
    ctx.ellipse(cx, cy + rh * 0.55, rw * 0.92, rh * 0.55, 0, 0, TAU);
    ctx.fill();

    // stilk
    ctx.strokeStyle = '#5d6b21';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - 2, cy - rh + 2);
    ctx.quadraticCurveTo(cx + 1, cy - rh - 7, cx + 7, cy - rh - 8);
    ctx.stroke();
    ctx.strokeStyle = '#7d8a2e';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - 3, cy - rh + 1);
    ctx.quadraticCurveTo(cx - 8, cy - rh - 4, cx - 11, cy - rh - 1);
    ctx.stroke();

    // solstrejf oppe til venstre
    ctx.fillStyle = 'rgba(255,225,160,0.5)';
    ctx.beginPath();
    ctx.ellipse(cx - rw * 0.30, cy - rh * 0.42, rw * 0.17, rh * 0.13, -0.5, 0, TAU);
    ctx.fill();
  } else { // fence
    ctx.fillStyle = '#a06e46';
    ctx.fillRect(o.x, y, 6, o.h);
    ctx.fillRect(o.x + o.w - 6, y, 6, o.h);
    ctx.fillRect(o.x - 3, y + 8, o.w + 6, 6);
    ctx.fillRect(o.x - 3, y + o.h - 20, o.w + 6, 6);
    // solstrejf på oversiden af hegnet
    ctx.fillStyle = 'rgba(255,205,140,0.5)';
    ctx.fillRect(o.x - 3, y + 8, o.w + 6, 2);
    ctx.fillRect(o.x - 3, y + o.h - 20, o.w + 6, 2);
  }
}

function draw() {
  // --- Solnedgangshimmel (lys og varm) ---
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0.00, '#7fa8dd');   // lys blå
  sky.addColorStop(0.28, '#a993d1');   // lys lavendel
  sky.addColorStop(0.52, '#e58a9d');   // lys rosa
  sky.addColorStop(0.74, '#ff9f63');   // varm orange
  sky.addColorStop(0.92, '#ffcf88');   // gylden ved horisonten
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Stjerner — dæmpede, da himlen nu er lys
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    const tw = 0.7 + 0.3 * Math.sin(tick * 0.05 + i);
    ctx.globalAlpha = s.a * tw * 0.3 * Math.max(0, 1 - s.y / 95);
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Sol der er ved at gå ned bag bakkerne
  const sunX = W - 190, sunY = GROUND - 105;
  const glow = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, 230);
  glow.addColorStop(0, 'rgba(255,240,190,0.95)');
  glow.addColorStop(0.30, 'rgba(255,180,95,0.45)');
  glow.addColorStop(1, 'rgba(255,120,80,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,214,120,0.45)';
  ctx.beginPath();
  ctx.arc(sunX, sunY, 68, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#fff3c4';
  ctx.beginPath();
  ctx.arc(sunX, sunY, 48, 0, TAU);
  ctx.fill();
  // solstrejf på himlen over solen
  ctx.fillStyle = 'rgba(255,225,160,0.18)';
  ctx.beginPath();
  ctx.ellipse(sunX, sunY, 260, 46, 0, 0, TAU);
  ctx.fill();

  // Skyer, oplyst nedefra af solen
  clouds.forEach(c => {
    const cg = ctx.createLinearGradient(0, c.y - 20*c.s, 0, c.y + 20*c.s);
    cg.addColorStop(0, 'rgba(196,178,222,0.9)');
    cg.addColorStop(0.6, 'rgba(250,180,175,0.92)');
    cg.addColorStop(1, 'rgba(255,222,170,0.95)');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(c.x, c.y, 22*c.s, 0, Math.PI*2);
    ctx.arc(c.x + 20*c.s, c.y - 8*c.s, 26*c.s, 0, Math.PI*2);
    ctx.arc(c.x + 45*c.s, c.y, 20*c.s, 0, Math.PI*2);
    ctx.fill();
  });

  // Fugle på vej hjem
  ctx.strokeStyle = 'rgba(80,55,90,0.55)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 4; i++) {
    const bx = ((i*230 - frame*0.35) % (W + 300) + W + 300) % (W + 300) - 150;
    const by = 60 + i*18 + Math.sin(frame*0.05 + i) * 5;
    const wing = Math.sin(frame*0.25 + i) * 5;
    ctx.beginPath();
    ctx.moveTo(bx - 9, by + wing);
    ctx.quadraticCurveTo(bx - 4, by - 4, bx, by);
    ctx.quadraticCurveTo(bx + 4, by - 4, bx + 9, by + wing);
    ctx.stroke();
  }

  // Bakker i baggrunden (silhuetter i aftensol) — fjerneste først
  const scrollFar = (frame * speed * 0.15) % 520;
  ctx.fillStyle = 'rgba(158,116,158,0.62)';
  for (let i = -1; i < 4; i++) {
    ctx.beginPath();
    ctx.arc(i*520 - scrollFar + 260, GROUND + 130, 200, Math.PI, 0);
    ctx.fill();
  }
  const scroll = (frame * speed * 0.3) % 400;
  for (let i = -1; i < 4; i++) {
    const hx = i*400 - scroll + 200;
    const hg = ctx.createLinearGradient(0, GROUND - 80, 0, GROUND + 60);
    hg.addColorStop(0, '#a3658a');
    hg.addColorStop(1, '#5b3a63');
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.arc(hx, GROUND + 110, 170, Math.PI, 0);
    ctx.fill();
  }

  // Jord i varme aftenfarver
  const dirt = ctx.createLinearGradient(0, GROUND, 0, H);
  dirt.addColorStop(0, '#a07a52');
  dirt.addColorStop(1, '#6b4f38');
  ctx.fillStyle = dirt;
  ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = 'rgba(255,205,140,0.14)';
  for (let i = 0; i < 20; i++) {
    const gx = (i*60 - (frame*speed) % 60);
    ctx.fillRect(gx, GROUND + 15, 25, 4);
    ctx.fillRect(gx + 30, GROUND + 32, 20, 4);
  }
  // Græs kant med solstrejf
  ctx.strokeStyle = '#c19a63';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, GROUND);
  ctx.lineTo(W, GROUND);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,225,170,0.7)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, GROUND - 2);
  ctx.lineTo(W, GROUND - 2);
  ctx.stroke();

  // Forhindringer
  obstacles.forEach(drawObstacle);

  // Støvpartikler (varmt aftenstøv)
  particles.forEach(p => {
    ctx.fillStyle = `rgba(255,222,175,${0.8 * p.life})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, TAU);
    ctx.fill();
  });

  // Blød skygge under hesten
  if (state !== 'menu') {
    const lift = Math.max(0, GROUND - horse.y);
    const sh = Math.max(0.15, 1 - lift / 220);
    ctx.fillStyle = `rgba(120,75,60,${0.35 * sh})`;
    ctx.beginPath();
    ctx.ellipse(horse.x, GROUND + 4, 34 * sh + 6, 6 * sh + 2, 0, 0, TAU);
    ctx.fill();
  }

  // Bonus-point-tekster
  ctx.textAlign = 'center';
  floaters.forEach(f => {
    ctx.globalAlpha = Math.min(1, f.life * 1.6);
    ctx.fillStyle = f.combo ? '#ffd23f' : '#fff6cf';
    ctx.font = f.combo ? 'bold 20px Segoe UI' : (f.small ? 'bold 20px Segoe UI' : 'bold 26px Segoe UI');
    ctx.fillText(f.text, f.x, f.y);
    ctx.globalAlpha = 1;
  });

  // Hest
  if (state !== 'menu') drawHorse(horse.x, horse.y, horse.legPhase, state === 'gameover', horse.spin);

  // --- HUD: stort pointtal + combo ---
  if (state === 'playing') {
    ctx.save();
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(58,38,72,0.45)';
    ctx.beginPath();
    ctx.roundRect(18, 16, 208, 70, 15);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,235,190,0.45)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = '#ffe8b0';
    ctx.font = 'bold 14px Segoe UI';
    ctx.fillText('POINT', 36, 41);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 34px Segoe UI';
    ctx.fillText(String(Math.floor(score)), 36, 76);

    if (combo > 1) {
      const pulse = 1 + 0.06 * Math.sin(tick * 0.35);
      ctx.save();
      ctx.translate(238, 76);
      ctx.scale(pulse, pulse);
      ctx.fillStyle = '#ffd23f';
      ctx.font = 'bold 22px Segoe UI';
      ctx.fillText(`COMBO x${combo}`, 0, 0);
      ctx.restore();
    }
    ctx.restore();
  }

  // Tekst-overlay
  ctx.textAlign = 'center';
  if (state === 'menu') {
    ctx.fillStyle = 'rgba(45,30,55,0.42)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 42px Segoe UI';
    ctx.fillText('🐴 Hesteløber', W/2, H/2 - 60);
    ctx.font = 'italic 16px Segoe UI';
    ctx.fillStyle = '#ffc94d';
    ctx.fillText('Hesten har sit græskarkostume på 🎃', W/2, H/2 - 32);
    ctx.font = '22px Segoe UI';
    ctx.fillStyle = '#fff';
    ctx.fillText('Tryk mellemrum eller klik for at starte', W/2, H/2 - 4);
    ctx.font = '17px Segoe UI';
    ctx.fillStyle = '#ffe08a';
    ctx.fillText('Hop: 1 tryk  •  Dobbeltspring: 2 tryk i luften', W/2, H/2 + 24);
    ctx.fillStyle = '#ffd9a8';
    ctx.fillText('Undgå buske, sten, hegn og græskar!', W/2, H/2 + 50);
    ctx.fillStyle = '#ffd23f';
    ctx.font = 'bold 17px Segoe UI';
    ctx.fillText('Tætte spring = bonuspoint og COMBO', W/2, H/2 + 76);
    ctx.font = '16px Segoe UI';
    ctx.fillStyle = '#e8f4d0';
    ctx.fillText('Point får du kun ved at springe!', W/2, H/2 + 100);
    ctx.fillStyle = '#fff';
    // lille græsplet + galoperende hest på jorden (til højre, så teksten er fri)
    ctx.fillStyle = '#7d6247';
    ctx.beginPath();
    ctx.ellipse(W - 140, GROUND + 6, 110, 14, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,205,140,0.45)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(W - 140, GROUND + 1, 110, 12, 0, 0, TAU);
    ctx.stroke();
    drawHorse(W - 175, GROUND, tick * 0.22, false);
  } else if (state === 'gameover') {
    ctx.fillStyle = 'rgba(45,30,55,0.5)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff6b6b';
    ctx.font = 'bold 40px Segoe UI';
    ctx.fillText('Du tabte! 💥', W/2, H/2 - 40);
    ctx.fillStyle = '#fff';
    ctx.font = '24px Segoe UI';
    ctx.fillText(`Point: ${Math.floor(score)}  —  Bedste: ${best}`, W/2, H/2 + 5);
    ctx.font = '18px Segoe UI';
    ctx.fillText('Tryk mellemrum eller klik for at prøve igen', W/2, H/2 + 45);
  }
}

let tick = 0;
function loop() {
  tick++;
  update();
  draw();
  requestAnimationFrame(loop);
}

addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
});
canvas.addEventListener('mousedown', jump);
canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); }, { passive: false });

loop();
</script>
</body>
</html>
